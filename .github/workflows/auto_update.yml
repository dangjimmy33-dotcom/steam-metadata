name: Steam Metadata Auto Tracker

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh AppList from Steam
        env:
          STEAM_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: |
          if [ -n "$STEAM_KEY" ]; then
            python tracker.py --fetch-applist --steam-key "$STEAM_KEY"
          else
            python tracker.py --fetch-applist
          fi

      - name: Run Tracker
        run: |
          python tracker.py --run --concurrency 10

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ cache/checkpoint.json
          if git diff --staged --quiet; then
            echo "No new updates found."
          else
            git commit -m "Auto-update: sync latest Steam metadata [skip ci]"
            git push origin main
          fi
